name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - name: Build
        run: dotnet build RhodiumVault.csproj -c Release
      - name: Test
        run: dotnet test tests/RhodiumVault.Tests -c Release
